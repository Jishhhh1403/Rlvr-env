[project]
name = "ledgergym"
version = "0.1.0"
description = "LedgerGym: an RLVR training environment for verifiable financial reasoning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch",
    "transformers>=4.46",
    "trl>=0.13",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
]
tracking = ["wandb"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgergym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
